# ============================================================
# Agentic Recipe Config — Disaggregated Mode (SGLang + Mooncake)
# ============================================================
#
# Combines the disaggregated training/rollout setup (separate node pools
# with Mooncake cross-node weight sync) with the agentic proxy server
# for remote agent execution.
#
# Entry point: python3 -m recipe.agentic.agentic_disagg_main
#
# ============================================================
# Usage
# ============================================================
#
#   python3 -m recipe.agentic.agentic_disagg_main \
#       actor_rollout_ref.model.path=/mnt/models/Qwen3.6-27B \
#       data.train_harbor_dir=/mnt/data/swe-bench-verified \
#       data.val_harbor_dir=/mnt/data/swe-bench-verified \
#       proxy_server.llm_proxy_ip=10.0.1.5 \
#       trainer.nnodes=1 \
#       rollout.nnodes=1
#

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ============================================================
# Disaggregated mode
# ============================================================

actor_rollout_ref:
  hybrid_engine: False
  rollout:
    free_cache_engine: False
    calculate_log_probs: True
    layered_summon: True
    load_format: safetensors
    checkpoint_engine:
      backend: mooncake

algorithm:
  rollout_correction:
    bypass_mode: True

rollout:
  nnodes: 1
  n_gpus_per_node: 8

# ============================================================
# Agentic: data
# ============================================================

data:
  return_raw_chat: true
  prompt_key: instance_id
  train_harbor_dir: null
  val_harbor_dir: null
  harbor_cache_dir: "~/.cache/verl/agentic/harbor"
  harbor_data_source: "harbor"
  harbor_ability: "agent"
  harbor_overwrite: false
  harbor_train_limit: null
  harbor_val_limit: null

# ============================================================
# Agentic: proxy server
# ============================================================

proxy_server:
  host: "0.0.0.0"
  port: 0
  tool_format: "hermes"
  llm_proxy_ip: null

# ============================================================
# Agentic: remote agent
# ============================================================

remote_agent:
  agent_name: swe-agent
  agent_import_path: null
  model_name: openai/qwen-max
  agent_kwargs:
    total_cost_limit: 0
    per_instance_cost_limit: 0
  max_retries: null
  retry_base_delay: null
  task_path_template: null
  environment_overrides: null
  environment_import_path: "harbor.environments.ack:ACKEnvironment"
  environment_kwargs: {}
  use_local_trial: true
  proxy_server_url: null
  harbor_server_url: null
  harbor_timeout: null
